name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and calculate Android version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must follow vMAJOR.MINOR.PATCH (for example, v1.0.0)." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit must belong to the main branch." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          for component in "$major" "$minor" "$patch"; do
            if [[ "$component" != "0" && "$component" == 0* ]]; then
              echo "Version components must not contain leading zeroes." >&2
              exit 1
            fi
          done
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version components exceed Android versionCode limits." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated versionCode is outside Android's valid range." >&2
            exit 1
          fi

          echo "RELEASE_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "One or more required release-signing secrets are missing." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/afazeres-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run checks and build signed artifacts
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease testDebugUnitTest bundleRelease assembleRelease

      - name: Prepare release assets and checksums
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/afazeres-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/afazeres-$VERSION.apk"
          cd release-assets
          sha256sum "afazeres-$VERSION.aab" "afazeres-$VERSION.apk" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "Afazeres $VERSION" \
            --generate-notes
